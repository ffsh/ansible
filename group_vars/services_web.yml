website_vhosts:
  - name: freifunk-stormarn.de
    config_filename: freifunk-stormarn
    type: redirect
    tls: false
    redirect_to: freifunk-suedholstein.de

  - name: lauenburg.freifunk.net
    config_filename: lauenburg
    type: redirect
    tls: false
    redirect_to: freifunk-suedholstein.de

  - name: stormarn.freifunk.net
    config_filename: stormarn
    type: redirect
    tls: false
    redirect_to: freifunk-suedholstein.de

  - name: freifunk-suedholstein.de
    aliases:
      - www.freifunk-suedholstein.de
    root: /var/www/web-static
    owner: website-deploy
    group: www-data
    mode: "0755"
    index: index.html
    type: static
    tls: true
    redirect_http_to_https: true
    autoindex: false
    stats_proxy: http://127.0.0.1:9100/
    cors_enabled: true
    cors_allowed_origins:
      - localhost
      - www.freifunk-suedholstein.de
      - freifunk-suedholstein.de

  - name: firmware.freifunk-suedholstein.de
    root: /var/www/firmware
    owner: root
    group: root
    mode: "0755"
    index: index.html index.htm index.nginx-debian.html
    type: static
    tls: true
    redirect_http_to_https: false
    serve_http: true
    autoindex: true
    no_cache: false
    location_access_log: /var/log/nginx/firmware.log
    cors_enabled: true
    cors_allow_all: true

  - name: beta.freifunk-suedholstein.de
    root: /var/www/web-beta
    owner: beta-deploy
    group: www-data
    mode: "0755"
    index: index.html
    type: static
    tls: true
    redirect_http_to_https: true
    autoindex: false
    cors_enabled: false
    cors_allow_all: false

  - name: install.freifunk-suedholstein.de
    config_filename: install
    root: /var/www/firmware-selector
    owner: root
    group: root
    index: index.html
    type: static
    tls: true
    redirect_http_to_https: true
    autoindex: true
    http_access_log: true
    quiet_common_files: true
    cache_static_assets: true
    no_cache: false

website_deploy_users:
  - username: beta-deploy
    group: www-data
    shell: /bin/bash
    web_root: /var/www/web-beta
    web_root_mode: "0755"
    ssh_key: "{{ vault_secrets.vault_website_beta_deploy_public_key | default('') }}"
  - username: website-deploy
    group: www-data
    shell: /bin/bash
    web_root: /var/www/web-static
    web_root_mode: "0755"
    ssh_key: "{{ vault_secrets.vault_website_prod_deploy_public_key | default('') }}"

website_nginx_sites_available_dir: /etc/nginx/sites-available
website_nginx_sites_enabled_dir: /etc/nginx/sites-enabled
website_default_email: noc@freifunk-suedholstein.de
website_auto_issue_tls: true
website_disabled_sites:
  - ffsh-firmware.conf
  - ffshev
  - reinbek
