- name: Validate supported unattended-upgrades operating systems
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts["distribution"] == "Ubuntu" and
        ansible_facts["distribution_version"] == "24.04") or
        (ansible_facts["distribution"] == "Debian" and
        ansible_facts["distribution_major_version"] == "13")
    fail_msg: "Unattended-upgrades supports Ubuntu 24.04 or Debian 13 only."

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable daily package list updates and unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Restrict unattended upgrades to security updates without reboots
  ansible.builtin.template:
    src: 52ffsh-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52ffsh-unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Enable apt upgrade timers
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
