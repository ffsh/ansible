- name: Set up public ssh keys for root
  ansible.posix.authorized_key:
    user: "{{ users[0]['username'] }}"
    state: present
    exclusive: false
    key: '{{ item }}'
  with_file:
    - files/benjamin_ed25519.pub
    - files/benjamin_rsa.pub
    - files/kaj_rsa.pub
    - files/ulf_rsa.pub
    - files/ulf_rsa_2022.pub
    - files/ulf_ecdsa.pub

- name: Remove revoked maintainer SSH keys from root
  ansible.posix.authorized_key:
    user: "{{ users[0]['username'] }}"
    state: absent
    key: '{{ item }}'
  with_file:
    - files/felix_imac_rsa.pub
    - files/felix_ipad_rsa.pub
    - files/stephen_rsa.pub
