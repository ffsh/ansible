- name: Install prerequisites for Grafana repository
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Grafana repository signing key
  ansible.builtin.get_url:
    url: "{{ grafana_apt_key_url }}"
    dest: /tmp/grafana.gpg.key
    mode: "0644"

- name: Convert Grafana repository signing key
  ansible.builtin.command:
    cmd: "gpg --dearmor --output {{ grafana_apt_keyring }} /tmp/grafana.gpg.key"
    creates: "{{ grafana_apt_keyring }}"

- name: Configure Grafana APT repository
  ansible.builtin.apt_repository:
    repo: "{{ grafana_apt_repository }}"
    filename: grafana
    state: present
    update_cache: true

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started

- name: Create Grafana dashboard directory
  ansible.builtin.file:
    path: "{{ grafana_dashboard_directory }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Configure Grafana dashboard provider
  ansible.builtin.template:
    src: dashboard-provider.yml.j2
    dest: "{{ grafana_dashboard_provisioning_file }}"
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana

- name: Install Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ grafana_dashboard_directory }}/{{ item | basename }}"
    owner: grafana
    group: grafana
    mode: "0644"
  with_fileglob:
    - "{{ grafana_dashboard_source_directory }}/*.json"
  notify: Restart Grafana

- name: Remove superseded wireguard-dashboard (replaced by status-dashboard)
  ansible.builtin.file:
    path: "{{ grafana_dashboard_directory }}/wireguard-dashboard.json"
    state: absent
  notify: Restart Grafana
