- name: Validate website vhost types
  ansible.builtin.assert:
    that:
      - item.type | default('static') in ['static', 'redirect']
    fail_msg: "Website vhost {{ item.name }} must be static or redirect."
  loop: "{{ website_vhosts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Validate website redirect vhosts
  ansible.builtin.assert:
    that:
      - item.redirect_to is defined
      - item.redirect_to | length > 0
      - not (item.tls | default(true))
    fail_msg: "Redirect vhost {{ item.name }} must define redirect_to and disable TLS."
  loop: "{{ website_vhosts }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.type | default('static') == 'redirect'

- name: Validate website HTTP listener settings
  ansible.builtin.assert:
    that:
      - not (item.serve_http | default(false) and item.redirect_http_to_https | default(true))
    fail_msg: "Website vhost {{ item.name }} cannot both serve and redirect HTTP."
  loop: "{{ website_vhosts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install nginx and certbot
  ansible.builtin.apt:
    pkg:
      - nginx
      - certbot
      - openssl
      - python3-certbot-nginx
    state: present

- name: Check whether the nginx DH parameters exist
  ansible.builtin.stat:
    path: "{{ website_default_ssl_dhparam }}"
  register: website_dhparam_stat

- name: Generate nginx DH parameters
  ansible.builtin.command: >-
    openssl dhparam -out {{ website_default_ssl_dhparam | quote }}
    {{ website_dhparam_bits }}
  changed_when: true
  when: not website_dhparam_stat.stat.exists
  notify: Reload nginx

- name: Create the Certbot systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/certbot.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the Certbot renewal service to use nginx
  ansible.builtin.template:
    src: certbot.service.j2
    dest: /etc/systemd/system/certbot.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload certbot

- name: Configure the Certbot renewal timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Install the Certbot renewal metrics script
  ansible.builtin.copy:
    src: certbot-renewal-metrics.sh
    dest: /usr/local/sbin/certbot-renewal-metrics
    owner: root
    group: root
    mode: "0755"

- name: Configure the Certbot renewal metrics service
  ansible.builtin.template:
    src: certbot-renewal-metrics.service.j2
    dest: /etc/systemd/system/certbot-renewal-metrics.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload certbot

- name: Configure the Certbot renewal metrics timer
  ansible.builtin.template:
    src: certbot-renewal-metrics.timer.j2
    dest: /etc/systemd/system/certbot-renewal-metrics.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload certbot

- name: Generate the initial Certbot renewal metrics sample
  ansible.builtin.command: /usr/local/sbin/certbot-renewal-metrics
  changed_when: false

- name: Enable the Certbot renewal metrics timer
  ansible.builtin.systemd:
    name: certbot-renewal-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Ensure website deployment users exist
  ansible.builtin.user:
    name: "{{ deploy_user.username }}"
    state: present
    create_home: true
    shell: "{{ deploy_user.shell | default('/bin/bash') }}"
    group: "{{ deploy_user.group | default('www-data') }}"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.username }}"

- name: Ensure website deployment directories exist
  ansible.builtin.file:
    path: "{{ deploy_user.web_root }}"
    state: directory
    owner: "{{ deploy_user.username }}"
    group: "{{ deploy_user.group | default('www-data') }}"
    mode: "{{ deploy_user.web_root_mode | default('0755') }}"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.web_root }}"

- name: Ensure website deployment directory contents are owned by each deploy user
  ansible.builtin.file:
    path: "{{ deploy_user.web_root }}"
    state: directory
    recurse: true
    owner: "{{ deploy_user.username }}"
    group: "{{ deploy_user.group | default('www-data') }}"
    mode: "u=rwX,g=rX,o=rX"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.web_root }}"

- name: Install website deployment SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user.username }}"
    state: present
    key: "{{ deploy_user.ssh_key }}"
    exclusive: false
    manage_dir: true
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.username }}"
  when:
    - deploy_user.ssh_key is defined
    - deploy_user.ssh_key | length > 0

- name: Ensure all website document roots exist
  ansible.builtin.file:
    path: "{{ item.root }}"
    state: directory
    owner: "{{ item.owner | default('www-data') }}"
    group: "{{ item.group | default('www-data') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when: item.type | default('static') == 'static'

- name: Check whether a certificate already exists for each configured vhost
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.cert_name | default(item.name) }}/fullchain.pem"
  register: website_cert_stat
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when: item.tls | default(true)

- name: Obtain TLS certificates for configured vhosts when explicitly enabled
  when: website_auto_issue_tls | bool
  block:
    - name: Find configured vhosts with missing certificates
      ansible.builtin.set_fact:
        website_missing_certs: >-
          {{ website_cert_stat.results
             | selectattr('stat.exists', 'defined')
             | selectattr('stat.exists', 'equalto', false)
             | list }}

    - name: Stop nginx before standalone certificate issuance
      ansible.builtin.systemd:
        name: nginx
        state: stopped
      when: website_missing_certs | length > 0

    - name: Issue missing TLS certificates
      ansible.builtin.command: >-
        certbot certonly --standalone --non-interactive --agree-tos --email {{ website_default_email }}
        --cert-name {{ item.cert_name | default(item.name) }}
        {% for domain in ([item.name] + (item.aliases | default([]))) %}
        -d {{ domain }}
        {% endfor %}
      args:
        creates: "/etc/letsencrypt/live/{{ item.cert_name | default(item.name) }}/fullchain.pem"
      loop: "{{ website_vhosts }}"
      loop_control:
        loop_var: item
      when:
        - item.tls | default(true)
        - not website_cert_stat.results | selectattr('item.name', 'equalto', item.name) | map(attribute='stat.exists') | first
  always:
    - name: Start nginx after standalone certificate issuance
      ansible.builtin.systemd:
        name: nginx
        state: started
      when: website_missing_certs | length > 0

- name: Recheck TLS certificates after issuance
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.cert_name | default(item.name) }}/fullchain.pem"
  register: website_cert_stat_recheck
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when: item.tls | default(true)

- name: Fail before enabling TLS vhosts when the certificate is missing
  ansible.builtin.assert:
    that:
      - website_cert_stat_recheck.results | selectattr('item.name', 'equalto', item.name) | map(attribute='stat.exists') | first
    fail_msg: >-
      No certificate exists for {{ item.name }}. Issue the certificate manually or set
      website_auto_issue_tls=true for automatic issuance.
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when: item.tls | default(true)

- name: Ensure nginx site configuration files exist
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ website_nginx_sites_available_dir }}/{{ item.config_filename | default((item.name | replace('.', '-')) ~ '.conf') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  notify: Reload nginx

- name: Enable nginx website config files
  ansible.builtin.file:
    src: "{{ website_nginx_sites_available_dir }}/{{ item.config_filename | default((item.name | replace('.', '-')) ~ '.conf') }}"
    dest: "{{ website_nginx_sites_enabled_dir }}/{{ item.config_filename | default((item.name | replace('.', '-')) ~ '.conf') }}"
    state: link
    force: true
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item

- name: Disable default nginx config
  ansible.builtin.file:
    path: "{{ website_nginx_sites_enabled_dir }}/default"
    state: absent

- name: Disable retired nginx sites
  ansible.builtin.file:
    path: "{{ website_nginx_sites_enabled_dir }}/{{ item }}"
    state: absent
  loop: "{{ website_disabled_sites }}"
  notify: Reload nginx

- name: Configure Certbot nginx authenticator and installer
  ansible.builtin.command: >-
    certbot reconfigure --non-interactive
    --cert-name {{ item.cert_name | default(item.name) }}
    --authenticator nginx
    --installer nginx
  changed_when: false
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when:
    - website_configure_certbot_nginx | bool
    - item.tls | default(true)

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  notify: Reload nginx

- name: Verify Certbot renewal with the nginx plugin
  ansible.builtin.command: certbot renew --dry-run --nginx --no-random-sleep-on-renew
  changed_when: false
  when: website_verify_certbot_renewal | bool
