- name: Install nginx and PHP runtime
  ansible.builtin.apt:
    pkg:
      - nginx
      - php8.3-fpm
      - php8.3-cli
      - certbot
      - python3-certbot-nginx
    state: present

- name: Ensure website deployment users exist
  ansible.builtin.user:
    name: "{{ deploy_user.username }}"
    state: present
    create_home: true
    shell: "{{ deploy_user.shell | default('/bin/bash') }}"
    group: "{{ deploy_user.group | default('www-data') }}"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.username }}"

- name: Ensure website deployment directories exist
  ansible.builtin.file:
    path: "{{ deploy_user.web_root }}"
    state: directory
    owner: "{{ deploy_user.username }}"
    group: "{{ deploy_user.group | default('www-data') }}"
    mode: "{{ deploy_user.web_root_mode | default('0755') }}"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.web_root }}"

- name: Ensure website deployment directory contents are owned by each deploy user
  ansible.builtin.file:
    path: "{{ deploy_user.web_root }}"
    state: directory
    recurse: true
    owner: "{{ deploy_user.username }}"
    group: "{{ deploy_user.group | default('www-data') }}"
    mode: "u=rwX,g=rX,o=rX"
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.web_root }}"

- name: Install website deployment SSH keys
  ansible.posix.authorized_key:
    user: "{{ deploy_user.username }}"
    state: present
    key: "{{ deploy_user.ssh_key }}"
    exclusive: false
    manage_dir: true
  loop: "{{ website_deploy_users }}"
  loop_control:
    loop_var: deploy_user
    label: "{{ deploy_user.username }}"
  when:
    - deploy_user.ssh_key is defined
    - deploy_user.ssh_key | length > 0

- name: Ensure all website document roots exist
  ansible.builtin.file:
    path: "{{ item.root }}"
    state: directory
    owner: "{{ item.owner | default('www-data') }}"
    group: "{{ item.group | default('www-data') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item

- name: Check whether a certificate already exists for each configured vhost
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"
  register: website_cert_stat
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item

- name: Obtain TLS certificates for configured vhosts when explicitly enabled
  ansible.builtin.command: >-
    certbot certonly --standalone --non-interactive --agree-tos --email {{ website_default_email }}
    {% for domain in (item.aliases | default([]) + [item.name]) %}
    -d {{ domain }}
    {% endfor %}
  args:
    creates: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  when:
    - item.tls | default(true)
    - website_auto_issue_tls | bool
    - not website_cert_stat.results | selectattr('item.name', 'equalto', item.name) | map(attribute='stat.exists') | first

- name: Fail before enabling TLS vhosts when the certificate is missing
  ansible.builtin.assert:
    that:
      - not (item.tls | default(true)) or (website_cert_stat.results | selectattr('item.name', 'equalto', item.name) | map(attribute='stat.exists') | first)
    fail_msg: >-
      No certificate exists for {{ item.name }}. Issue the certificate manually or set
      website_auto_issue_tls=true for automatic issuance.
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item

- name: Ensure nginx site configuration files exist
  ansible.builtin.template:
    src: site.conf.j2
    dest: "{{ website_nginx_sites_available_dir }}/{{ item.name | replace('.', '-') }}.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item
  notify: Reload nginx

- name: Enable nginx website config files
  ansible.builtin.file:
    src: "{{ website_nginx_sites_available_dir }}/{{ item.name | replace('.', '-') }}.conf"
    dest: "{{ website_nginx_sites_enabled_dir }}/{{ item.name | replace('.', '-') }}.conf"
    state: link
    force: true
  loop: "{{ website_vhosts }}"
  loop_control:
    loop_var: item

- name: Disable default nginx config
  ansible.builtin.file:
    path: "{{ website_nginx_sites_enabled_dir }}/default"
    state: absent

- name: Validate nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false
  notify: Reload nginx
