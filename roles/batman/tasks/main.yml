- name: Install basic packages
  ansible.builtin.apt:
    name: dkms

- name: Copy batman repair helper
  ansible.builtin.template:
    src: fix-batman.sh
    dest: /root/fix-batman.sh
    mode: "0740"
    owner: root
    group: root
  when: batman_version is defined

- name: Check for currently installed batman-adv
  ansible.builtin.script: files/get_batman_version.py
  args:
    executable: python3
  register: batman_installed_version
  when: batman_version is defined
  changed_when: false
  check_mode: false

- name: Print batman version and target
  ansible.builtin.debug:
    msg: >-
      Currently installed batman: {{ batman_installed_version.stdout |
      default('not_installed') }}, target is: {{ batman_version |
      default('unknown') }}

- name: Apply batman-adv netns_immutable hotfix to existing source
  ansible.builtin.include_tasks: hotfix_netns.yml
  when:
    - batman_version is defined
    - not ansible_check_mode

- name: Rebuild already installed batman-adv after hotfix
  ansible.builtin.command: "dkms install -m batman-adv -v {{ batman_version }} --force"
  changed_when: true
  when:
    - batman_version is defined
    - not ansible_check_mode
    - batman_netns_patch is changed
    - (batman_installed_version.stdout | default('')) == batman_version

- name: Check if batman-adv needs to be installed or upgraded
  ansible.builtin.include_tasks: from_source.yml
  when:
    - batman_version is defined
    - (batman_installed_version.stdout | default('')) != batman_version
