- name: Install firmware release helper dependencies
  ansible.builtin.apt:
    name:
      - curl
      - jq
      - tar
      - gzip
      - bzip2
      - xz-utils
      - unzip
      - git

- name: Configure Git safe directories for firmware release paths
  ansible.builtin.command:
    argv:
      - git
      - config
      - --global
      - --add
      - safe.directory
      - "{{ firmware_release_root }}"
  changed_when: false

- name: Install firmware release helper script
  ansible.builtin.template:
    src: firmware-release.sh
    dest: "{{ firmware_release_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Ensure firmware release root exists
  ansible.builtin.file:
    path: "{{ firmware_release_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure firmware release content is root-owned
  ansible.builtin.file:
    path: "{{ firmware_release_root }}"
    state: directory
    recurse: true
    owner: root
    group: root
    mode: "u=rwX,g=rX,o=rX"
